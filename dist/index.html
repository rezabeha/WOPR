<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c09">
  <meta name="description" content="A 1200-baud line into a 1983 mainframe. Connect, explore the game directory, and meet the computer on the other end.">
  <title>JOSHUA — W.O.P.R. Terminal</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./terminal.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body class="scanlines glow cursor-blink">
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m4 6 6 6-6 6m9 0h7"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8m-4-4v4M6 8l3 3-3 3m5 0h4"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M1 13h4l3-8 4 15 4-13 3 6h4"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm12 0q3 3 0 6m3-9q6 6 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zm13 0 6 6m0-6-6 6"/></symbol>
    <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 14 6-6m-6 8-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 1v6m0 10v6M1 12h6m10 0h6"/></symbol>
    <symbol id="i-return" viewBox="0 0 24 24"><path d="M20 5v8H4m5-5-5 5 5 5"/></symbol>
  </svg>
  <div id="phosphor" aria-hidden="true"></div>
  <div class="station">
    <header class="station-header">
      <div class="identity"><img src="./assets/mark.svg" width="42" height="42" alt=""><div><div class="brand">WOPR SYSTEMS</div><div class="brand-sub">STRATEGIC COMPUTING DIVISION</div></div></div>
      <div class="system-status"><span class="online"><b class="led"></b>SYSTEM ONLINE</span><span class="clock"><svg class="icon"><use href="#i-time"/></svg><time id="clock">00:00:00 UTC</time></span></div>
    </header>
    <main class="console" id="console" aria-label="Remote terminal">
      <div class="rail"><span><svg class="icon"><use href="#i-terminal"/></svg> TERMINAL SESSION</span><span class="rail-id">TTY–01 <b class="register" aria-hidden="true"></b></span></div>
      <div class="screen">
        <section class="workarea" aria-label="Terminal input and output">
          <div class="wordhead" id="wordhead">
            <h1><img src="./assets/wordmark.svg" width="502" height="74" alt="W.O.P.R."></h1>
            <div class="expansion">WAR OPERATION PLAN RESPONSE</div>
          </div>
          <div id="game-area"></div>
          <div id="log" class="transcript" role="region" aria-label="Terminal transcript" tabindex="0"></div>
          <form id="command-form" autocomplete="off" spellcheck="false">
            <label id="prompt" for="command">LOGON:</label>
            <div class="input-wrap"><input id="command" type="text" aria-label="Terminal command or logon name" maxlength="240" autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="send" spellcheck="false"><span id="block" aria-hidden="true"></span></div>
            <button class="enter" type="submit" aria-label="Submit command" title="Submit command"><svg class="icon"><use href="#i-return"/></svg></button>
          </form>
          <div id="entry-note" class="entry-note">Type <button data-command="HELP">HELP</button> for terminal assistance.</div>
        </section>
        <aside class="scope" aria-label="Signal monitor">
          <div class="scope-head"><span><svg class="icon"><use href="#i-target"/></svg><b id="scope-title">SIGNAL MONITOR</b></span><span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
          <div class="scope-view"><canvas id="scope-canvas" width="720" height="470" role="img" aria-label="Rotating wireframe globe with projected coastlines and a simulated carrier trace"></canvas></div>
          <div class="wave-box"><div class="wave-head"><span><svg class="icon"><use href="#i-wave"/></svg><span id="wave-title">CARRIER WAVE</span></span><span id="wave-value">1200 HZ</span></div><canvas id="wave" width="720" height="90" aria-hidden="true"></canvas></div>
          <div class="scope-foot"><span><b class="tiny-led"></b><span id="scope-state">ACQUIRING</span></span><span id="scope-mode">RX / TX</span></div>
        </aside>
      </div>
      <nav class="controls" aria-label="Terminal controls">
        <div class="keys"><button data-command="HELP"><kbd>F1</kbd> HELP</button><button data-command="SETTINGS"><kbd>F2</kbd> SETTINGS</button><button data-command="RECONNECT"><kbd>F3</kbd> RECONNECT</button><button data-command="FULLSCREEN"><kbd>F4</kbd> FULLSCREEN</button></div>
        <button class="audio" data-command="SOUND" id="audio-button"><svg class="icon"><use id="audio-icon" href="#i-mute"/></svg><span id="audio-label">SOUND OFF</span></button>
      </nav>
    </main>
    <footer class="station-footer"><div class="line-info"><svg class="icon"><use href="#i-link"/></svg><span id="line-speed">1200 BAUD</span><i>/</i><span>8-N-1</span><i>/</i><span>FULL DUPLEX</span></div><span>WOPR-OS &nbsp; REV. 4.8</span></footer>
    <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <dialog id="panel" aria-labelledby="panel-title"><div class="panel-rail"><h2 id="panel-title"></h2><button id="close-panel" aria-label="Close panel"><kbd>ESC</kbd> CLOSE</button></div><div id="panel-body"></div></dialog>
  <noscript>This terminal requires JavaScript. Enable it and reconnect.</noscript>
</body>
</html>
